name: Build

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions: read-all

jobs:
  compatibility:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
      - name: Verify the established Go floor and interpreter
        run: |
          test "$(go list -m -f '{{.GoVersion}}')" = "1.20"
          test "$(go list -m -f '{{.Version}}' go.starlark.net)" = "v0.0.0-20260324133313-ffb3f39dd27a"

  ci:
    permissions:
      contents: read
      id-token: write
    # Reusable CI lives in 1set/meta — the single source of truth for every
    # Star* module's pipeline. Pinned to a commit SHA for supply-chain safety;
    # bump the pin when meta's workflow changes (Dependabot github-actions can
    # automate this).
    uses: 1set/meta/.github/workflows/go-ci.yml@23f088bcd6dce16c93e0056d7b70b4f4434208e8
    with:
      go-floor: "1.20"
      doc-coverage: true
      doc-coverage-file: docs/API.md
      doc-coverage-config: true
      cov-min: 69
      footprint: true
      footprint-max-mb: 7
    secrets: inherit

  # Seed the exact PR base once before normal master uploads are available.
  baseline:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out pull request base
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - name: Set up Go 1.20
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.20.x
      - name: Generate base coverage
        run: go test -race -count=1 -covermode=atomic -coverprofile=coverage-base.txt ./...
      - name: Upload base coverage
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          use_oidc: true
          files: coverage-base.txt
          disable_search: true
          override_commit: ${{ github.event.pull_request.base.sha }}
          override_branch: ${{ github.event.pull_request.base.ref }}
          fail_ci_if_error: true
